services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gexam-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - gexam-data:/app/data
      # path to your gate-questions checkout
      - ${QUESTIONS_PATH:-../gate-questions}:/gate-questions:ro

volumes:
  gexam-data:
